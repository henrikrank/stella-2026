name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: id-token lets it prove the artifact came
# from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a finished build
# always makes it out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # Where the site is served from decides the base path, and getting it
        # wrong 404s every script and asset:
        #   custom domain (CNAME present) -> served from the root
        #   plain project site            -> served from /<repo>/
        # Deriving it from the CNAME file keeps the two in step instead of
        # hard-coding a prefix that only suits one of them.
        run: |
          if [ -f CNAME ]; then
            export VITE_BASE=/
            echo "custom domain $(cat CNAME) -> base /"
          else
            export VITE_BASE="/${{ github.event.repository.name }}/"
            echo "project site -> base $VITE_BASE"
          fi
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
