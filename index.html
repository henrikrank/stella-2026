<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stella — 3D Character</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="loader">
      <div class="loader-inner">
        <h1>Loading character</h1>
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <p id="loader-status">0%</p>
      </div>
    </div>

    <div id="tracker" hidden>
      <span class="tracker-label">You</span>
      <div id="hearts"><i></i><i></i><i></i></div>
      <span class="tracker-sep"></span>
      <span class="tracker-label">Ghost</span>
      <span id="axe-badge">Axe</span>
      <div id="pips"><i></i><i></i><i></i></div>
    </div>

    <div id="hurt"></div>

    <div id="gameover">
      <div class="card">
        <h2 id="over-title">The manor is quiet again</h2>
        <p id="over-detail">Three hits landed. The ghost is gone.</p>
        <button id="again">Play again</button>
      </div>
    </div>

    <div id="touch" hidden>
      <div id="stick-zone">
        <div id="stick-base"><div id="stick-knob"></div></div>
      </div>
      <div id="buttons">
        <button id="btn-jump" type="button">JUMP</button>
        <button id="btn-attack" type="button">HIT</button>
      </div>
    </div>

    <div id="hud" hidden>
      <div class="hud-keys">
        <span><b>W S</b> — walk &nbsp;·&nbsp; <b>A D</b> — turn &nbsp;·&nbsp; <b>Q E</b> — sidestep</span>
        <span><b>Shift</b> — run</span>
        <span><b>Space</b> — jump</span>
        <span><b>F</b> — attack &nbsp;·&nbsp; walk over the axe to arm</span>
        <span><b>Drag</b> — orbit &nbsp;·&nbsp; <b>Scroll</b> — zoom</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
